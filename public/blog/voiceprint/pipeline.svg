<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6B8AFF"/></marker><marker id="ahd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#85817A"/></marker></defs><rect x="16" y="118" width="118" height="84" rx="12" fill="#6B8AFF" fill-opacity="0.06" stroke="#6B8AFF" stroke-width="1.5"/><text x="75" y="152" text-anchor="middle" font-size="13" font-weight="600" fill="#6B8AFF">Your samples</text><text x="75" y="172" text-anchor="middle" font-size="9.5" fill="#A29E94">at least 3 samples</text><text x="75" y="186" text-anchor="middle" font-size="9.5" fill="#A29E94">500+ words</text><line x1="134" y1="160" x2="194" y2="160" stroke="#6B8AFF" stroke-width="1.8" marker-end="url(#ah)"/><rect x="198" y="108" width="140" height="104" rx="12" fill="#6B8AFF" fill-opacity="0.06" stroke="#6B8AFF" stroke-width="1.5"/><circle cx="268" cy="138" r="11" fill="none" stroke="#8AA4FF" stroke-width="1.3"/><circle cx="268" cy="138" r="5" fill="none" stroke="#8AA4FF" stroke-width="1.3"/><text x="268" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#6B8AFF">Fingerprint</text><text x="268" y="190" text-anchor="middle" font-size="8.8" fill="#A29E94">function words, sentence length,</text><text x="268" y="202" text-anchor="middle" font-size="8.8" fill="#A29E94">comma rate, neural embedding</text><path d="M300 108 C300 70 360 64 416 64" fill="none" stroke="#6B8AFF" stroke-width="1.8" marker-end="url(#ah)"/><rect x="420" y="36" width="126" height="60" rx="12" fill="#6B8AFF" fill-opacity="0.06" stroke="#6B8AFF" stroke-width="1.5"/><text x="483" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="#6B8AFF">Score a draft</text><text x="483" y="82" text-anchor="middle" font-size="9" fill="#A29E94">voice match 0 to 1</text><line x1="338" y1="160" x2="416" y2="160" stroke="#6B8AFF" stroke-width="1.8" marker-end="url(#ah)"/><rect x="420" y="118" width="126" height="84" rx="12" fill="#6B8AFF" fill-opacity="0.06" stroke="#6B8AFF" stroke-width="1.5"/><text x="483" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#6B8AFF">Adapt the draft</text><text x="483" y="170" text-anchor="middle" font-size="9" fill="#A29E94">one model call,</text><text x="483" y="183" text-anchor="middle" font-size="9" fill="#A29E94">meaning preserved</text><line x1="546" y1="160" x2="606" y2="160" stroke="#6B8AFF" stroke-width="1.8" marker-end="url(#ah)"/><rect x="610" y="118" width="98" height="84" rx="12" fill="#6B8AFF" fill-opacity="0.06" stroke="#6B8AFF" stroke-width="1.5"/><text x="659" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#6B8AFF">Validate</text><text x="659" y="169" text-anchor="middle" font-size="8.4" fill="#A29E94">before vs after,</text><text x="659" y="181" text-anchor="middle" font-size="8.4" fill="#A29E94">per-sentence diff</text><path d="M659 118 C659 92 560 80 546 70" fill="none" stroke="#85817A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ahd)"/><text x="600" y="104" text-anchor="middle" font-size="8.5" fill="#85817A">re-score</text></svg>